name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        continue-on-error: true

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps

      - name: Fetch Quran Page Images
        run: |
          python3 fetch-images.py
        continue-on-error: true

      - name: Copy Web Files to www
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp quran.json www/
          cp pages.json www/
          cp manifest.json www/
          cp sw.js www/
          cp settings.js www/
          cp extras.js www/
          cp adhkar.js www/
          cp parts.js www/
          cp prayer.js www/
          cp mushaf.js www/
          cp flipbook.js www/
          cp zoom.js www/
          cp juz-complete.js www/
          cp adhan-auto.js www/
          cp adhan-native.js www/
          cp position.js www/
          cp offline-audio.js www/
          cp mushaf-zoom.js www/
          cp qibla.js www/
          cp asma-data.js www/
          cp asma.js www/
          cp adhan*.mp3 www/ 2>/dev/null || true
          cp page-flip.browser.js www/
          [ -f cover-pro.html ] && cp cover-pro.html www/ || true
          [ -d images ] && cp -r images www/ || true
          [ -d pages-img ] && cp -r pages-img www/ || true
          echo "www:"
          ls -la www/

      - name: Create Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          bash patch-android.sh

      - name: Set versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName\|applicationId" android/app/build.gradle

      - name: Generate Icons and Splash
        run: |
          npm install @capacitor/assets --save-dev
          npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quran-release.keystore"
          ls -la "$RUNNER_TEMP/quran-release.keystore"

      - name: Build Release (APK + AAB)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign APK and AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/quran-release.keystore"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          O=android/app/build/outputs
          "$BT/zipalign" -f -p 4 "$O/apk/release/app-release-unsigned.apk" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" --out "$OUT/quran-app-release.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify "$OUT/quran-app-release.apk"
          rm -f "$OUT/aligned.apk" "$OUT/aligned.apk.idsig"
          cp "$O/bundle/release/app-release.aab" "$OUT/quran-app-release.aab"
          jarsigner -keystore "$KS" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 "$OUT/quran-app-release.aab" "$KEY_ALIAS"
          jarsigner -verify "$OUT/quran-app-release.aab"
          ls -la "$OUT"

      - name: Build Debug APK (fallback)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK (fallback)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Signed APK and AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-release-signed
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "قرآن v1.0.${{ github.run_number }}"
          body: |
            ## القرآن الكريم

            - مصحف كامل (604 صفحة)
            - تلاوة صوتية
            - مواقيت الصلاة
            - أذان تلقائي
            - بوصلة القبلة
            - أسماء الله الحسنى
            - تنزيل التلاوات (Offline)
            - الأذكار

            الإصدار: v1.0.${{ github.run_number }}

            حمّل APK من الأسفل وثبّته على هاتفك.
          files: |
            out/*.apk
            android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
