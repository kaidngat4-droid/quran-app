name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Capacitor dependencies
      run: |
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

    - name: Copy web assets to Android
      run: |
        mkdir -p android/app/src/main/assets/public
        cp -r index.html manifest.json sw.js quran.json style.css app.js images android/app/src/main/assets/public/ 2>/dev/null || true

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew || true

    - name: Build APK with Gradle
      run: |
        cd android
        gradle wrapper --gradle-version 8.9
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quran-app-debug
        path: android/app/build/outputs/apk/debug/*.apk
