name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK Manually
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest 2>/dev/null || true
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Accept Licenses & Install SDK Packages
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

    - name: Remove existing android folder
      run: rm -rf android

    - name: Install Capacitor
      run: |
        npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

    - name: Init Capacitor Project
      run: |
        npx cap init "القرآن الكريم" "com.salah.quranapp" --web-dir=.
        npx cap add android

    - name: Copy Web Assets
      run: |
        mkdir -p android/app/src/main/assets/public
        cp index.html manifest.json sw.js quran.json style.css app.js android/app/src/main/assets/public/ 2>/dev/null || true
        cp -r images android/app/src/main/assets/public/ 2>/dev/null || true
        npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quran-app-apk
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
