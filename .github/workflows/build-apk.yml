name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        continue-on-error: true

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps

      - name: Fetch Quran Page Images
        run: |
          python3 fetch-images.py
        continue-on-error: true

      - name: Copy Web Files to www
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp quran.json www/
          cp pages.json www/
          cp manifest.json www/
          cp sw.js www/
          cp settings.js www/
          cp extras.js www/
          cp adhkar.js www/
          cp parts.js www/
          cp prayer.js www/
          cp mushaf.js www/
          cp flipbook.js www/
          cp zoom.js www/
          cp juz-complete.js www/
          cp adhan-auto.js www/
          cp adhan-native.js www/
          cp position.js www/
          cp offline-audio.js www/
          cp mushaf-zoom.js www/
          cp qibla.js www/
          cp asma-data.js www/
          cp asma.js www/
          cp adhan*.mp3 www/ 2>/dev/null || true
          cp page-flip.browser.js www/
          [ -f cover-pro.html ] && cp cover-pro.html www/ || true
          [ -d images ] && cp -r images www/ || true
          [ -d pages-img ] && cp -r pages-img www/ || true
          echo "📁 محتوى www:"
          ls -la www/

      - name: Create Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          bash patch-android.sh

      - name: Add Signing Config to build.gradle
        run: |
          python3 << 'INNEREOF'
          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # أضف signingConfigs قبل buildTypes
          signing_config = """    signingConfigs {
              release {
                  storeFile file('quran-release.keystore')
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          
          """
          
          if 'signingConfigs' not in content:
              # ابحث عن buildTypes وأضف قبلها
              if 'buildTypes {' in content:
                  content = content.replace('    buildTypes {', signing_config + '    buildTypes {', 1)
          
          # أضف signingConfig في release
          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace(
                  'release {
            minifyEnabled false',
                  'release {
            minifyEnabled false
            signingConfig signingConfigs.release',
                  1
              )
          
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          print("✅ تم إضافة signingConfigs")
          INNEREOF
          
          # تحقق
          grep -A 5 "signingConfigs" android/app/build.gradle
          echo "---"
          grep -A 3 "release {" android/app/build.gradle | head -8

      - name: Generate Icons and Splash
        run: |
          npm install @capacitor/assets --save-dev
          npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/quran-release.keystore
          ls -la android/app/quran-release.keystore

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Build Debug APK (fallback)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-app-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Signed APK (Release)
        uses: actions/upload-artifact@v4
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        with:
          name: quran-app-release-signed
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "قرآن v1.0.${{ github.run_number }}"
          body: |
            ## 📖 القرآن الكريم
            
            ### ✨ الميزات:
            - 📖 مصحف كامل (604 صفحة)
            - 🎙️ تلاوة صوتية (8 قراء)
            - 🕌 مواقيت الصلاة (صنعاء)
            - 🔔 أذان تلقائي
            - 🧭 بوصلة القبلة
            - 📿 أسماء الله الحسنى
            - 📥 تنزيل التلاوات (Offline)
            - 💾 حفظ آخر موضع قراءة
            - 🤲 الأذكار
            
            ### 📝 التحديثات:
            - الإصدار: v1.0.${{ github.run_number }}
            - التاريخ: ${{ github.event.head_commit.timestamp }}
            
            ### 📦 التثبيت:
            حمّل APK من الأسفل وثبّته على هاتفك.
            
            **ملاحظة:** قد تحتاج لتفعيل "تثبيت من مصادر غير معروفة" في إعدادات هاتفك.
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
