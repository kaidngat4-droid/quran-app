name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        continue-on-error: true

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android Project
        run: |
          rm -rf android
          rm -f capacitor.config.json

          echo '{
            "appId": "com.salah.quranapp",
            "appName": "القرآن الكريم",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

          mkdir -p www
          cp index.html manifest.json sw.js quran.json style.css app.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-app-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
