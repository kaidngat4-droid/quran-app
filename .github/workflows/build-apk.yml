name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        continue-on-error: true

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps

      - name: Fetch Quran Page Images
        run: |
          python3 fetch-images.py
        continue-on-error: true

      - name: Copy Web Files to www
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp quran.json www/
          cp pages.json www/
          cp manifest.json www/
          cp sw.js www/
          cp settings.js www/
          cp extras.js www/
          cp parts.js www/
          cp prayer.js www/
          cp mushaf.js www/
          cp flipbook.js www/
          cp zoom.js www/
          cp juz-complete.js www/
          cp page-flip.browser.js www/
          [ -f cover-pro.html ] && cp cover-pro.html www/ || true
          [ -d images ] && cp -r images www/ || true
          [ -d pages-img ] && cp -r pages-img www/ || true
          echo "📁 محتوى www:"
          ls -la www/

      - name: Create Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate Icons and Splash
        run: |
          npm install @capacitor/assets --save-dev
          npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-app-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "قرآن v1.0.${{ github.run_number }}"
          body: |
            ## 📖 القرآن الكريم
            - الإصدار: v1.0.${{ github.run_number }}
            - التاريخ: ${{ github.event.head_commit.timestamp }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
