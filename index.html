<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📖 القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Tajawal',sans-serif;background:#0f2027;color:#fff;position:relative}

/* ============ شاشة البداية ============ */
#cover{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:1000;
  background:linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.95)),url("images/mosque.jpg") no-repeat center/cover;
  transition:opacity 0.6s ease}
#cover.hidden{opacity:0;pointer-events:none}
.card{text-align:center;padding:45px 30px;border-radius:25px;background:rgba(0,0,0,0.55);backdrop-filter:blur(15px);max-width:90%}
.title{font-size:42px;font-family:'Amiri Quran',serif;color:#FFD700;margin-bottom:10px}
.subtitle{margin:18px 0;font-size:17px;color:#EEE}
.btn{background:linear-gradient(45deg,#FF5500,#FFAA00);border:none;padding:14px 40px;border-radius:12px;color:#fff;font-size:17px;font-weight:600;cursor:pointer;margin-bottom:20px;transition:0.3s;box-shadow:0 4px 15px rgba(255,85,0,0.4)}
.btn:active{transform:scale(0.95)}
.dev{text-align:center;font-size:13px;color:#bbb}
.dev b{color:#FFDD00;font-size:15px}

/* ============ الهيدر العلوي ============ */
#header{position:fixed;top:0;right:0;left:0;height:60px;background:rgba(15,32,39,0.95);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;padding:0 15px;z-index:100;border-bottom:1px solid rgba(255,215,0,0.2)}
#menuBtn{background:transparent;border:none;color:#FFD700;font-size:26px;cursor:pointer;padding:8px;border-radius:8px;transition:0.2s}
#menuBtn:active{background:rgba(255,215,0,0.15)}
#headerTitle{color:#FFD700;font-size:19px;font-weight:700;font-family:'Amiri Quran',serif}
#settingsBtn{background:transparent;border:none;color:#FFD700;font-size:22px;cursor:pointer;padding:8px;border-radius:8px}

/* ============ Sidebar (قائمة السور) ============ */
#sidebar{position:fixed;top:0;right:-320px;width:300px;height:100vh;background:#0f2027;z-index:200;
  transition:right 0.3s ease;display:flex;flex-direction:column;box-shadow:-5px 0 20px rgba(0,0,0,0.5);border-left:1px solid rgba(255,215,0,0.2)}
#sidebar.open{right:0}
.sidebar-header{padding:18px 15px;border-bottom:1px solid rgba(255,215,0,0.2);display:flex;justify-content:space-between;align-items:center}
.sidebar-title{color:#FFD700;font-size:18px;font-weight:700}
#closeSidebar{background:transparent;border:none;color:#FFD700;font-size:24px;cursor:pointer;padding:5px 10px}
#searchSurah{width:calc(100% - 30px);margin:12px 15px;padding:11px 15px;border-radius:10px;border:1px solid rgba(255,215,0,0.3);
  background:rgba(255,215,0,0.08);color:#fff;font-size:15px;font-family:'Tajawal'}
#searchSurah::placeholder{color:#aaa}
#surahList{flex:1;overflow-y:auto;padding:5px 10px 20px}
.surah-item{width:100%;padding:14px 15px;margin:5px 0;border:none;border-radius:12px;background:rgba(255,255,255,0.05);
  color:#FFD700;font-family:'Tajawal';font-size:15px;text-align:right;cursor:pointer;transition:0.2s;display:flex;justify-content:space-between;align-items:center}
.surah-item:active{background:rgba(255,215,0,0.2)}
.surah-item.active{background:linear-gradient(135deg,#FF5500,#FFAA00);color:#fff;font-weight:700}
.surah-item .num{font-size:12px;background:rgba(0,0,0,0.3);padding:3px 8px;border-radius:6px}

/* ============ Overlay خلف Sidebar ============ */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;display:none;opacity:0;transition:opacity 0.3s}
#overlay.show{display:block;opacity:1}

/* ============ منطقة المصحف ============ */
#mushaf{position:fixed;top:60px;bottom:110px;right:0;left:0;overflow-y:auto;padding:15px;scroll-behavior:smooth}
#mushaf::-webkit-scrollbar{width:4px}
#mushaf::-webkit-scrollbar-thumb{background:#FFD700;border-radius:4px}
.surah-header{text-align:center;padding:20px 15px;margin-bottom:15px;border:2px solid #FFD700;border-radius:15px;
  background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(255,170,0,0.08));position:relative}
.surah-header h2{color:#FFD700;font-family:'Amiri Quran',serif;font-size:28px;margin-bottom:5px}
.surah-header .info{color:#ccc;font-size:13px}
.bismillah{text-align:center;font-family:'Amiri Quran',serif;font-size:28px;color:#FFD700;padding:20px 0;margin:10px 0}
.ayah{font-family:'Amiri Quran',serif;font-size:26px;line-height:2.4;padding:12px 15px;margin:10px 0;border-radius:12px;
  background:rgba(255,255,255,0.04);color:#fff;cursor:pointer;transition:0.3s;position:relative}
.ayah:active{background:rgba(255,215,0,0.15)}
.ayah.active{background:linear-gradient(135deg,rgba(255,85,0,0.25),rgba(255,170,0,0.15));border-right:4px solid #FFAA00}
.ayah .num{display:inline-block;min-width:38px;height:38px;line-height:38px;text-align:center;background:#FFD700;color:#0f2027;
  border-radius:50%;font-size:14px;font-weight:700;margin:0 8px;vertical-align:middle;font-family:'Tajawal'}
.ayah .bookmark{position:absolute;top:10px;left:10px;color:#FFD700;font-size:18px;opacity:0.5}
.ayah .bookmark.active{opacity:1}

/* ============ المشغل السفلي ============ */
#player{position:fixed;bottom:0;right:0;left:0;background:rgba(15,32,39,0.98);backdrop-filter:blur(15px);
  padding:12px 15px;border-top:1px solid rgba(255,215,0,0.2);z-index:90}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:10px}
.controls button{width:48px;height:48px;border:none;border-radius:50%;background:linear-gradient(135deg,#FF5500,#FFAA00);
  color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(255,85,0,0.3)}
.controls button:active{transform:scale(0.92)}
.controls #playBtn{width:58px;height:58px;font-size:24px}
#progress{width:100%;height:5px;-webkit-appearance:none;appearance:none;background:rgba(255,215,0,0.2);border-radius:5px;outline:none;margin-top:5px}
#progress::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#FFD700;border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(255,215,0,0.6)}
.time-display{display:flex;justify-content:space-between;color:#aaa;font-size:12px;margin-top:4px}

/* ============ شاشة التحميل ============ */
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);
  padding:20px 40px;border-radius:15px;color:#FFD700;font-size:17px;z-index:2000;display:none;text-align:center}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(255,215,0,0.3);border-top-color:#FFD700;
  border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ الوضع الليلي (اختياري) ============ */
body.light-mode{background:#f5f5dc;color:#222}
body.light-mode #header{background:rgba(245,245,220,0.95);border-bottom-color:#FFAA00}
body.light-mode #sidebar{background:#f5f5dc}
body.light-mode .surah-item{background:rgba(0,0,0,0.05);color:#8B4513}
body.light-mode .ayah{background:rgba(0,0,0,0.03);color:#222}
body.light-mode #player{background:rgba(245,245,220,0.98)}

/* ============ Responsive ============ */
@media (max-width:400px){
  .title{font-size:34px}
  .ayah{font-size:23px;line-height:2.2}
  .surah-header h2{font-size:24px}
}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFAA00">
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>

<!-- شاشة التحميل -->
<div id="loading"><div class="spinner"></div><br>جاري التحميل...</div>

<!-- شاشة البداية -->
<div id="cover">
  <div class="card">
    <div class="title">📖 القرآن الكريم</div>
    <div class="subtitle">مصحف كامل مع التلاوة الصوتية</div>
    <button class="btn" onclick="startApp()">ابدأ الآن</button>
    <div class="dev">
      <span>تصميم وتطوير</span>
      <b>👨‍💻 D / Salah Al-ahdel</b>
    </div>
  </div>
</div>

<!-- الهيدر العلوي -->
<div id="header" style="display:none">
  <button id="menuBtn" onclick="toggleSidebar()">☰</button>
  <span id="headerTitle">📖 القرآن الكريم</span>
  <button id="settingsBtn" onclick="toggleTheme()">🌙</button>
</div>

<!-- Overlay -->
<div id="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar قائمة السور -->
<div id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">📚 السور</span>
    <button id="closeSidebar" onclick="toggleSidebar()">✕</button>
  </div>
  <input type="text" id="searchSurah" placeholder="🔎 ابحث عن سورة...">
  <div id="surahList"></div>
</div>

<!-- منطقة المصحف -->
<div id="mushaf" style="display:none">
  <div id="mushafView"><h2 style="text-align:center;color:#FFD700;padding:40px">اختر سورة من القائمة ☰</h2></div>
</div>

<!-- المشغل السفلي -->
<div id="player" style="display:none">
  <div class="controls">
    <button onclick="prevAyah()">⏮</button>
    <button id="playBtn" onclick="togglePlay()">▶</button>
    <button onclick="nextAyah()">⏭</button>
  </div>
  <input type="range" id="progress" value="0" min="0" max="100">
  <div class="time-display">
    <span id="currentTime">0:00</span>
    <span id="duration">0:00</span>
  </div>
</div>

<!-- زر اختيار القارئ (يظهر داخل السورة) -->
<select id="readerSelect" style="display:none">
  <option value="ar.alafasy">مشاري العفاسي</option>
  <option value="ar.abdulbasitmurattal">عبد الباسط (مرتل)</option>
  <option value="ar.abdurrahmaansudais">عبد الرحمن السديس</option>
  <option value="ar.husary">محمود خليل الحصري</option>
  <option value="ar.minshawi">محمد صديق المنشاوي</option>
  <option value="ar.muhammadjibreel">محمد جبريل</option>
  <option value="ar.mahermuaiqly">ماهر المعيقلي</option>
  <option value="ar.shaatree">أبو بكر الشاطري</option>
  <option value="ar.hudhaify">علي الحذيفي</option>
  <option value="ar.ahmedajamy">أحمد بن علي العجمي</option>
</select>

<!-- بحث عام (مخفي) -->
<input type="text" id="search" style="display:none">

<script src="app.js"></script>
</body>
</html>
