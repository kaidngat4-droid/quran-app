<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal', sans-serif;background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;overflow:hidden;}
#cover{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;z-index:1000;background:linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.95)),url("images/mosque.jpg") no-repeat center/cover;transition:opacity 0.6s ease;}
#cover.hidden{opacity:0;pointer-events:none;}
.card{text-align:center;padding:55px 30px;border-radius:25px;background:rgba(0,0,0,0.55);backdrop-filter:blur(15px);}
.title{font-size:44px;font-family:'Amiri';color:#FFD700;margin-bottom:10px;}
.subtitle{margin:20px 0;font-size:18px;color:#EEEEEE;}
.btn{background: linear-gradient(45deg,#FF5500,#FFAA00);border:none;padding:14px 35px;border-radius:12px;color:#FFFFFF;font-size:17px;cursor:pointer;margin-bottom:20px;transition:0.3s;}
.btn:hover{transform:scale(1.08);}
.dev{text-align:center;font-size:14px;color:#bbb;}
.dev span{display:block;margin-bottom:5px;color:#CCCCCC;}
.dev b{font-weight:700;color:#FFDD00;font-size:16px;}
#app{display:none;height:100vh;}
.app{display:flex;height:100%;}
.sidebar{width:220px;background:rgba(0,0,0,0.5);padding:10px;overflow-y:auto;}
.sidebar button{width:100%;padding:10px;margin:5px 0;border:none;border-radius:8px;background:#333333;color:#FFD700;cursor:pointer;transition:0.3s;}
.sidebar button:hover{background:#FFAA00;}
.content{flex:1;padding:15px;overflow-y:auto;padding-bottom:120px;}
#readerSelect{width:100%;padding:10px;border-radius:10px;margin-bottom:10px;border:none;color:#000000;background:#FFD700;font-weight:600;}
#search{width:100%;padding:10px;border-radius:10px;border:none;margin-bottom:10px;color:#000000;background:#FFDD00;font-weight:600;}
.ayah{font-family:'Amiri Quran';font-size:24px;line-height:2.2;padding:10px;margin:8px 0;border-radius:10px;background:rgba(255,255,255,0.05);color:#FFFFFF;cursor:pointer;transition:0.3s;}
.ayah:hover{background:rgba(255,255,255,0.15);}
.active{background:#FFAA0055;border-right:5px solid #FFAA00;}
.sajda{border-right:4px solid gold;}
.player{position:fixed;bottom:0;width:100%;background:rgba(0,0,0,0.8);padding:10px;}
.controls{display:flex;justify-content:center;gap:10px;}
.controls button{padding:10px;border:none;border-radius:50%;background:#FFAA00;color:#000000;cursor:pointer;}
#progress{width:100%;margin-top:8px;}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:20px 40px;border-radius:15px;color:#FFD700;font-size:18px;z-index:2000;display:none;text-align:center;}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFAA00">
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>
<div id="loading">⏳ جاري تحميل بيانات القرآن...</div>
<div id="cover">
  <div class="card">
    <div class="title">📖 القرآن الكريم</div>
    <div class="subtitle">مصحف كامل مع التلاوة الصوتية</div>
    <button class="btn" onclick="startApp()">ابدأ الآن</button>
    <div class="dev">
      <span>تصميم وتطوير</span>
      <b>👨‍💻 D / Salah Al-ahdel</b>
    </div>
  </div>
</div>
<div id="app">
  <div class="app">
    <div class="sidebar" id="surahList"></div>
    <div class="content">
      <select id="readerSelect">
        <option value="ar.alafasy">العفاسي</option>
        <option value="ar.minshawi">المنشاوي</option>
        <option value="ar.abdulbasitmurattal">عبدالباسط</option>
        <option value="ar.husary">الحصري</option>
        <option value="ar.mahermuaiqly">ماهر المعيقلي</option>
        <option value="ar.abdurrahmaansudais">السديس</option>
        <option value="ar.ahmedajamy">أحمد العجمي</option>
        <option value="ar.muhammadjibreel">محمد جبريل</option>
      </select>
      <input type="text" id="search" placeholder="🔎 بحث">
      <div id="mushafView"><h2>اختر سورة</h2></div>
    </div>
  </div>
  <div class="player">
    <div class="controls">
      <button onclick="prevAyah()">⏮</button>
      <button onclick="togglePlay()" id="playBtn">▶</button>
      <button onclick="nextAyah()">⏭</button>
    </div>
    <input type="range" id="progress">
  </div>
</div>
<script>
const DB_NAME='QuranDB';const DB_VERSION=1;const STORE_NAME='surahs';
function openDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=(e)=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE_NAME)){db.createObjectStore(STORE_NAME,{keyPath:'id'});}};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
async function getAllSurahs(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readonly');const store=tx.objectStore(STORE_NAME);const request=store.getAll();request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
async function saveAllSurahs(surahs){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite');const store=tx.objectStore(STORE_NAME);surahs.forEach(s=>store.put(s));tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
async function getSurahById(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readonly');const store=tx.objectStore(STORE_NAME);const request=store.get(id);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
async function initQuranData(){const existing=await getAllSurahs();if(existing&&existing.length===114){console.log('✅ بيانات القرآن موجودة مسبقاً');return existing;}document.getElementById('loading').style.display='block';try{const response=await fetch('quran.json');const data=await response.json();await saveAllSurahs(data);document.getElementById('loading').style.display='none';return data;}catch(err){document.getElementById('loading').style.display='none';alert('❌ خطأ: '+err.message);throw err;}}
async function startApp(){await initQuranData();document.getElementById('cover').classList.add('hidden');setTimeout(()=>{document.getElementById('app').style.display='block';buildSurahList();},600);}
const surahList=document.getElementById("surahList");const mushafView=document.getElementById("mushafView");const readerSelect=document.getElementById("readerSelect");const search=document.getElementById("search");const progress=document.getElementById("progress");const playBtn=document.getElementById("playBtn");
let ayahs=[];let currentIndex=0;let currentSurah=0;let audio=new Audio();
async function buildSurahList(){const surahs=await getAllSurahs();surahs.sort((a,b)=>a.id-b.id);surahList.innerHTML='';surahs.forEach(s=>{const btn=document.createElement("button");btn.textContent=`${s.id}. ${s.name}`;btn.onclick=()=>loadSurah(s.id);surahList.appendChild(btn);});}
async function loadSurah(num){currentSurah=num;const surah=await getSurahById(num);if(!surah)return;mushafView.innerHTML=`<h2 style="color:#FFD700;margin-bottom:15px;">سورة ${surah.name}</h2>`;ayahs=surah.verses;ayahs.forEach((a,i)=>{const div=document.createElement("div");div.className="ayah";div.innerHTML=`${a.text} <span style="color:#FFAA00;font-size:16px;">﴿${a.id}﴾</span>`;div.onclick=()=>playAyah(i);mushafView.appendChild(div);});}
function playAyah(i) {
  currentIndex = i;
  const ayahNumber = ayahs[i].id;
  const globalNum = getGlobalAyahNumber(currentSurah, ayahNumber);
  audio.src = `https://cdn.islamic.network/quran/audio/128/${getReciterCode(readerSelect.value)}/${globalNum}.mp3`;
  audio.play();
  playBtn.textContent = "⏸";
  document.querySelectorAll(".ayah").forEach(a => a.classList.remove("active"));
  const ayahEls = document.querySelectorAll(".ayah");
  if (ayahEls[i]) ayahEls[i].classList.add("active");
}

function getReciterCode(reciter) {
  const map = {
    "ar.alafasy": "ar.alafasy",
    "ar.minshawi": "ar.minshawi",
    "ar.abdulbasitmurattal": "ar.abdulbasitmurattal",
    "ar.husary": "ar.husary",
    "ar.mahermuaiqly": "ar.mahermuaiqly",
    "ar.abdurrahmaansudais": "ar.abdurrahmaansudais",
    "ar.ahmedajamy": "ar.ahmedajamy",
    "ar.muhammadjibreel": "ar.muhammadjibreel"
  };
  return map[reciter] || "ar.alafasy";
}

function getGlobalAyahNumber(surahNum, ayahNum) {
  const ayahCounts = [0,7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
  let total = 0;
  for (let i = 1; i < surahNum; i++) {
    total += ayahCounts[i];
  }
  return total + ayahNum;
}/${surahNum}${ayahNum}.mp3`;audio.play();playBtn.textContent="⏸";document.querySelectorAll(".ayah").forEach(a=>a.classList.remove("active"));const ayahEls=document.querySelectorAll(".ayah");if(ayahEls[i])ayahEls[i].classList.add("active");}
function getReciterFolder(reciter){const map={"ar.alafasy":"Alafasy_128kbps","ar.minshawi":"Minshawy_Murattal_128kbps","ar.abdulbasitmurattal":"Abdul_Basit_Murattal_192kbps","ar.husary":"Husary_128kbps","ar.mahermuaiqly":"Maher_AlMuaiqly_128kbps","ar.abdurrahmaansudais":"Abdurrahmaan_As-Sudais_192kbps","ar.ahmedajamy":"Ahmed_ibn_Ali_al-Ajamy_128kbps","ar.muhammadjibreel":"Muhammad_Jibreel_128kbps"};return map[reciter]||"Alafasy_128kbps";}
function nextAyah(){if(currentIndex+1<ayahs.length)playAyah(currentIndex+1);}
function prevAyah(){if(currentIndex>0)playAyah(currentIndex-1);}
function togglePlay(){audio.paused?audio.play():audio.pause();}
audio.onplay=()=>playBtn.textContent="⏸";audio.onpause=()=>playBtn.textContent="▶";audio.onended=()=>nextAyah();audio.ontimeupdate=()=>{if(audio.duration)progress.value=(audio.currentTime/audio.duration)*100;};progress.oninput=()=>{if(audio.duration)audio.currentTime=(progress.value/100)*audio.duration;};
search.oninput=()=>{const val=search.value.trim();if(val===""){if(currentSurah)loadSurah(currentSurah);return;}mushafView.innerHTML="<h2>نتائج البحث</h2>";let count=0;ayahs.forEach((a,i)=>{if(a.text.includes(val)){const d=document.createElement("div");d.className="ayah";d.innerHTML=a.text;d.onclick=()=>playAyah(i);mushafView.appendChild(d);count++;}});if(count===0)mushafView.innerHTML+="<p style='color:#FFAA00'>لا توجد نتائج</p>";};
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('✅ Service Worker مسجل:', reg.scope))
      .catch(err => console.log('❌ فشل تسجيل SW:', err));
  });
}
</script>
</body>
</html>
